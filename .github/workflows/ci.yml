name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: minos
          POSTGRES_PASSWORD: minos
          POSTGRES_DB: minos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINOS_TEST_DATABASE_URL: postgresql+asyncpg://minos:minos@localhost:5432/minos_test
      MINOS_BENCH_DATABASE_URL: postgresql+asyncpg://minos:minos@localhost:5432/minos_bench
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked --python 3.14
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Benchmark (regression guard)
        # Gate G0 (2 ms) is measured on reference hardware; shared CI runners are noisier,
        # so CI uses a looser threshold to catch regressions without flaking.
        env:
          MINOS_BENCH_P99_MS: "3.0"
        run: uv run python bench/bench_engine.py --iterations 10000
      - name: API load test (regression guard)
        env:
          MINOS_BENCH_API_P99_MS: "20"
        run: uv run python bench/bench_api.py --seconds 10

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Gate G2: a business user builds, tests and publishes a rule set from the Studio.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: minos
          POSTGRES_PASSWORD: minos
          POSTGRES_DB: minos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MINOS_E2E_DATABASE_URL: postgresql+asyncpg://minos:minos@localhost:5432/minos_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.14
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  compose:
    # The local installation: build the images, start PostgreSQL + API + Studio, probe them.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - run: curl --fail --silent http://localhost:8000/v1/info
      - run: curl --fail --silent http://localhost:8080/v1/ready
      - run: curl --fail --silent --output /dev/null http://localhost:8080/w
      - name: Examples are published in workspace "esempi" and served to /demo
        run: |
          body='{"input": '"$(cat examples/inputs/order-valid.json)"'}'
          curl --fail --silent -H 'Content-Type: application/json' -d "$body" \
            http://localhost:8080/v1/exec/esempi/shop.order | grep '"outcome"'
          curl --fail --silent -H 'Content-Type: application/json' -d "$body" \
            http://localhost:8080/v1/exec/local/shop.order | grep '"outcome"'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

